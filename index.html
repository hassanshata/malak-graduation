<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مبروك يا ملك · Malak — Graduation 2026</title>
<meta name="theme-color" content="#ffeaf1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#fff5f8;
    --night-2:#ffeaf1;
    --night-3:#fcdbe7;
    --gold:#db6a9e;
    --gold-deep:#bf4d80;
    --blush:#d65f93;
    --cream:#883a5e;
    --cream-dim:rgba(136,58,94,.62);
    --ar-display:"Aref Ruqaa", "El Messiri", serif;
    --ar-body:"El Messiri", system-ui, sans-serif;
    --lat-display:"Cormorant Garamond", Georgia, serif;
    --lat-util:"Jost", system-ui, sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--ar-body);
    color:var(--cream);
    background:
      radial-gradient(120% 90% at 50% -10%, var(--night-2) 0%, var(--night) 46%, var(--night-3) 100%);
    min-height:100svh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ambient + confetti canvases */
  #ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
  #confetti{position:fixed;inset:0;z-index:60;pointer-events:none}

  .stage{
    position:relative;z-index:5;
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(18px,4vh,34px);
    padding:clamp(26px,6vh,60px) 22px calc(28px + env(safe-area-inset-bottom));
    text-align:center;
  }

  /* ---- header ---- */
  .eyebrow{
    font-family:var(--lat-util);
    font-weight:400;
    letter-spacing:.42em;
    text-transform:uppercase;
    font-size:clamp(10px,2.6vw,12.5px);
    color:var(--gold-deep);
    padding-inline-start:.42em;
    animation:rise .9s .15s ease backwards;
  }
  .name{
    font-family:var(--ar-display);
    font-weight:700;
    font-size:clamp(74px,30vw,140px);
    line-height:.92;
    color:transparent;
    background:linear-gradient(180deg,#f9bdd6 0%, var(--gold) 44%, var(--gold-deep) 100%);
    -webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 6px 24px rgba(219,106,158,.30));
    margin-top:-.06em;
    animation:bloom 1.1s .25s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .name-latin{
    font-family:var(--lat-display);
    font-style:italic;
    font-weight:500;
    font-size:clamp(20px,6vw,30px);
    letter-spacing:.06em;
    color:var(--blush);
    margin-top:.1em;
    animation:rise .9s .5s ease backwards;
  }
  .divider{
    display:flex;align-items:center;gap:12px;
    color:var(--gold-deep);
    animation:rise .9s .62s ease backwards;
  }
  .divider::before,.divider::after{
    content:"";height:1px;width:clamp(34px,12vw,62px);
    background:linear-gradient(90deg,transparent,var(--gold-deep));
  }
  .divider::after{background:linear-gradient(90deg,var(--gold-deep),transparent)}
  .divider span{font-size:15px;filter:drop-shadow(0 0 8px rgba(219,106,158,.55))}

  /* ---- gift / video card ---- */
  .gift{
    position:relative;
    width:min(80vw,330px);
    aspect-ratio:9/16;
    perspective:1400px;
    cursor:pointer;
    animation:bloom 1s .72s cubic-bezier(.2,.8,.2,1) backwards;
    -webkit-tap-highlight-color:transparent;
    border-radius:22px;
  }
  .gift:focus-visible{outline:3px solid var(--blush);outline-offset:6px}
  .gift-inner{position:relative;width:100%;height:100%}
  .face{
    position:absolute;inset:0;
    border-radius:22px;overflow:hidden;
    transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1);
  }
  .front{opacity:1;z-index:2}
  .gift.opened .front{opacity:0;transform:scale(1.05);pointer-events:none}

  /* seal / front */
  .front{
    background:
      linear-gradient(155deg, #ffffff 0%, #ffeaf2 55%, #fcd6e4 100%);
    border:1px solid rgba(219,106,158,.30);
    box-shadow:
      0 24px 52px -22px rgba(193,78,128,.40),
      inset 0 0 0 6px rgba(219,106,158,.06),
      inset 0 1px 0 rgba(255,255,255,.8);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:24px;padding:26px;
  }
  /* ribbon cross */
  .ribbon-v,.ribbon-h{position:absolute;background:linear-gradient(var(--gold),var(--gold-deep));opacity:.92;box-shadow:0 0 18px rgba(219,106,158,.35)}
  .ribbon-v{top:0;bottom:0;right:calc(50% - 8px);width:16px}
  .ribbon-h{left:0;right:0;top:calc(50% - 8px);height:16px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}

  .seal{
    position:relative;z-index:2;
    width:118px;height:118px;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle at 38% 32%, #ffe1ec, var(--gold) 40%, var(--gold-deep) 100%);
    box-shadow:0 10px 24px -6px rgba(193,78,128,.5), inset 0 0 0 3px rgba(255,255,255,.5), inset 0 -6px 14px rgba(150,40,82,.4);
    border:2px solid rgba(255,255,255,.55);
  }
  .seal span{font-family:var(--ar-display);font-weight:700;font-size:50px;color:#7a2348;line-height:1;transform:translateY(-2px)}
  .seal::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1px dashed rgba(122,35,72,.4)}

  .open-hint{
    position:relative;z-index:2;
    font-family:var(--ar-body);font-weight:500;
    font-size:16px;color:var(--cream);
    background:rgba(255,255,255,.7);
    padding:9px 16px;border-radius:999px;
    border:1px solid rgba(219,106,158,.4);
    backdrop-filter:blur(2px);
  }
  .pulse{animation:pulse 1.9s ease-in-out infinite}

  /* video / back */
  .back{
    opacity:0;transform:scale(.96);pointer-events:none;z-index:1;
    background:#1a0d14;
    border:1px solid rgba(219,106,158,.5);
    box-shadow:0 28px 64px -24px rgba(193,78,128,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .gift.opened .back{opacity:1;transform:scale(1);pointer-events:auto;z-index:3}
  .back video{width:100%;height:100%;object-fit:cover;display:block;background:#1a0d14}

  /* ---- closing ---- */
  .closing{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:54px;justify-content:flex-start}
  .mabrouk{
    font-family:var(--ar-display);font-weight:700;
    font-size:clamp(30px,9vw,46px);
    color:var(--blush);
    filter:drop-shadow(0 3px 16px rgba(214,95,147,.32));
    opacity:0;transform:translateY(10px);
  }
  .mabrouk.show{animation:bloom .9s ease both}
  .from-family{
    font-family:var(--ar-body);font-size:14.5px;color:var(--cream-dim);
    opacity:0;
  }
  .from-family.show{animation:rise .9s .25s ease both}

  footer{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    animation:rise 1s 1s ease backwards;
  }
  footer .ar{font-family:var(--ar-body);font-weight:500;font-size:14px;color:var(--cream)}
  footer .en{font-family:var(--lat-util);font-weight:400;letter-spacing:.16em;text-transform:uppercase;font-size:10.5px;color:var(--gold-deep)}
  footer .yr{font-family:var(--lat-display);font-style:italic;font-size:15px;color:var(--cream-dim);margin-top:2px}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes bloom{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.045);opacity:.82}}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;animation-delay:0s !important}
    .face{transition:opacity .3s ease}
    .gift.opened .front{transform:none}
    .gift.opened .back{transform:none}
    .pulse{animation:none}
  }
</style>
</head>
<body>
  <canvas id="ambient"></canvas>

  <main class="stage">
    <p class="eyebrow">Graduation · 2026</p>
    <h1 class="name">ملك</h1>
    <p class="name-latin">Malak</p>
    <div class="divider"><span>✦</span></div>

    <div class="gift" id="gift" role="button" tabindex="0" aria-label="اضغط لفتح مفاجأة العيلة">
      <div class="gift-inner" id="giftInner">
        <div class="face front">
          <div class="ribbon-v"></div>
          <div class="ribbon-h"></div>
          <div class="seal"><span>ملك</span></div>
          <p class="open-hint pulse">اضغط لفتح مفاجأة العيلة</p>
        </div>
        <div class="face back">
          <video id="vid" playsinline preload="none" poster="poster.jpg">
            <source src="malak.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </div>

    <div class="closing">
      <p class="mabrouk" id="mabrouk">مبروك يا ملك</p>
      <p class="from-family" id="fromFamily">من العيلة كلها بكل حب 🤍</p>
    </div>

    <footer>
      <span class="ar">كلية التجارة – شعبة اللغة الإنجليزية · جامعة عين شمس</span>
      <span class="en">Faculty of Commerce, English Section — Ain Shams University</span>
      <span class="yr">Class of 2026</span>
    </footer>
  </main>

  <canvas id="confetti"></canvas>

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GOLD=['#f4a8c8','#f9c6db','#db6a9e'], BLUSH=['#ec84ad','#fbe0ea'], CREAM='#ffd9e8';

  /* ---------- ambient sparkles ---------- */
  const aC=document.getElementById('ambient'), ax=aC.getContext('2d');
  let aw,ah,sparks=[];
  function sizeA(){aw=aC.width=innerWidth*devicePixelRatio;ah=aC.height=innerHeight*devicePixelRatio;ax.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  function seed(){sparks=[];const n=reduce?0:Math.min(46,Math.round(innerWidth/13));for(let i=0;i<n;i++)sparks.push(mk(Math.random()*innerHeight));}
  function mk(y){return{x:Math.random()*innerWidth,y:y,r:Math.random()*1.7+.5,s:Math.random()*.32+.12,sway:Math.random()*Math.PI*2,sw:Math.random()*.6+.2,a:Math.random()*.45+.25,c:Math.random()<.6?'#f0a8c6':'#e58bb0'};}
  function ambient(){
    ax.clearRect(0,0,innerWidth,innerHeight);
    for(const p of sparks){
      p.y-=p.s;p.sway+=0.01;const dx=Math.sin(p.sway)*p.sw;
      const tw=p.a*(0.6+0.4*Math.sin(p.sway*2.3));
      ax.beginPath();ax.fillStyle=p.c;ax.globalAlpha=tw;
      ax.arc(p.x+dx,p.y,p.r,0,7);ax.fill();
      if(p.y< -10){p.y=innerHeight+8;p.x=Math.random()*innerWidth;}
    }
    ax.globalAlpha=1;requestAnimationFrame(ambient);
  }
  sizeA();seed();if(!reduce)ambient();

  /* ---------- confetti burst ---------- */
  const cC=document.getElementById('confetti'),cx=cC.getContext('2d');
  let cw,ch,bits=[],running=false;
  function sizeC(){cw=cC.width=innerWidth*devicePixelRatio;ch=cC.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);}
  function burst(cxp,cyp){
    if(reduce)return;
    const N=150,pal=[...GOLD,...BLUSH,CREAM];
    for(let i=0;i<N;i++){
      const ang=Math.random()*Math.PI*2,sp=Math.random()*11+4;
      bits.push({x:cxp,y:cyp,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-3,
        g:.16+Math.random()*.12,w:Math.random()*7+4,h:Math.random()*4+3,
        rot:Math.random()*6,vr:(Math.random()-.5)*.4,
        col:pal[(Math.random()*pal.length)|0],life:90+Math.random()*40,t:0,
        shape:Math.random()<.5?'r':'c'});
    }
    if(!running){running=true;requestAnimationFrame(confetti);}
  }
  function confetti(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=bits.length-1;i>=0;i--){
      const b=bits[i];b.t++;b.vy+=b.g;b.vx*=.992;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;
      const fade=Math.max(0,1-b.t/b.life);
      cx.save();cx.translate(b.x,b.y);cx.rotate(b.rot);cx.globalAlpha=fade;cx.fillStyle=b.col;
      if(b.shape==='r')cx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      else{cx.beginPath();cx.arc(0,0,b.h/1.6,0,7);cx.fill();}
      cx.restore();
      if(b.t>=b.life||b.y>innerHeight+30)bits.splice(i,1);
    }
    if(bits.length){requestAnimationFrame(confetti);}else{running=false;cx.clearRect(0,0,innerWidth,innerHeight);}
  }
  sizeC();

  addEventListener('resize',()=>{sizeA();sizeC();seed();},{passive:true});

  /* ---------- reveal ---------- */
  const gift=document.getElementById('gift'),
        vid=document.getElementById('vid'),
        mab=document.getElementById('mabrouk'),
        fam=document.getElementById('fromFamily');
  let opened=false;
  function open(){
    if(opened)return;opened=true;
    const r=gift.getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height/2);
    gift.classList.add('opened');
    gift.style.cursor='default';
    gift.removeAttribute('role');
    const hint=gift.querySelector('.open-hint');if(hint)hint.classList.remove('pulse');
    // play with sound — this runs inside the user gesture, so audio is allowed
    setTimeout(()=>{ vid.setAttribute('controls','');
      const p=vid.play(); if(p&&p.catch)p.catch(()=>{vid.muted=true;vid.play();}); }, reduce?60:430);
    mab.classList.add('show');fam.classList.add('show');
    // a second gentle burst
    if(!reduce)setTimeout(()=>burst(r.left+r.width/2,r.top+r.height*0.35),650);
  }
  gift.addEventListener('click',open);
  gift.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
})();
</script>
</body>
</html>
